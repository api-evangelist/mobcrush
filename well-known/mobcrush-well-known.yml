description: >-
  Negative probe record for Mobcrush. Mobcrush Streaming, Inc. was acquired by Super League
  Gaming (now Super League Enterprise, Inc.) on 2 June 2021 and the brand was retired into the
  acquirer. The company domain mobcrush.com is still REGISTERED (NameCheap, registry expiry
  2026-11-26) and still DELEGATED to four Amazon Route 53 name servers, but the hosted zone
  behind that delegation has been deleted: every one of those name servers answers REFUSED, so
  every public resolver returns SERVFAIL for mobcrush.com and for every subdomain under it.
  No TCP connection to any Mobcrush host can be opened, which means no /.well-known/ path, no
  spec path, and no agent-card path could be probed at the HTTP layer at all. This is a lame
  delegation, not a 404 and not a parking lander — the distinction matters because the failure
  is at DNS, one layer below anything HTTP could report. NO WellKnown, SecurityTxt, AgentCard,
  LLMsTxt, MCPServer or OpenAPI pointer is emitted from this probe, and none should ever be
  emitted from it in a later round.

