description: >-
  Registry sweep for Mobcrush client libraries. Mobcrush Streaming, Inc. never ran a public
  developer program and never published a first-party SDK to any package registry. The only
  package carrying the name is a third-party community wrapper on PyPI, unmaintained since
  2017, which wrapped the internal www.mobcrush.com/api/ web API that backed the Mobcrush
  site and mobile apps. That API host has been unreachable since the domain's DNS delegation
  went lame, so the package no longer functions. No `SDKs` pointer is emitted from this file:
  there is no official first-party SDK to point at.

