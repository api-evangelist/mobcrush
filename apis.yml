x-domain-status: lame-delegation
x-domain-note: >-
  mobcrush.com is still registered with NameCheap (created 2013-11-26, registry expiry
  2026-11-26) and the .com registry still publishes four Amazon Route 53 name servers for it,
  but the hosted zone behind that delegation has been deleted — every one of those name servers
  answers REFUSED, so Google Public DNS, Cloudflare and Cloudflare DNS-over-HTTPS all return
  SERVFAIL for mobcrush.com and for every subdomain (www, api, developer, docs, app, status).
  No TCP connection to any Mobcrush host can be opened, so nothing could be probed at the HTTP
  layer. This is a DNS-layer failure, one level below anything a 404 or a parking lander could
  report, and it is why no host pointer is wired. See well-known/mobcrush-well-known.yml.
x-venue-listing-note: >-
  The Website pointer below is a Forge Global secondary-market listing page, not a Mobcrush
  host — the company has no live web presence of its own. It is retained only because the
  network-wide treatment of venue listings is tracked separately (roadmap#56); it should not be
  read as evidence that Mobcrush operates a website.
