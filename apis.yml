aid: mobcrush
name: Mobcrush
description: >-
  Mobcrush Streaming, Inc. was a Santa Monica, California live-streaming technology company,
  founded in 2013 by Royce Disini with James Hurley, Travis Rogers and Stephen Dao, that made
  it possible for mobile gamers to broadcast gameplay straight from an iOS or Android device
  with no capture card, no desktop encoder and no third-party software. Its differentiator was
  simulcast: a creator went live once and Mobcrush relayed the same broadcast simultaneously to
  Twitch, YouTube, Facebook, Twitter and Periscope at no extra charge, which turned the product
  from a competing destination into distribution infrastructure for creators who already had
  audiences elsewhere. The company added an advertising and sponsorship layer in 2018 ("Go Live,
  Get Paid") and operated Mineville, one of six official Minecraft server partners under
  agreement with Microsoft, reaching more than twenty million players a year. It raised roughly
  $35.9M across its rounds, including an $11M Series A in September 2015 led by Kleiner Perkins
  Caufield & Byers and a $20M round in 2016, with First Round Capital and Lowercase Capital also
  participating. Super League Gaming announced its acquisition of Mobcrush on 11 March 2021 and
  closed it on 2 June 2021 for approximately 12.6 million shares of common stock; the acquirer
  now trades as Super League Enterprise, Inc. and does not carry the Mobcrush brand forward as a
  product. Mobcrush ran a JSON web API at www.mobcrush.com/api/ that backed its own site and
  mobile apps, but it never published a developer portal, an API reference, a first-party SDK or
  any machine-readable specification, so there is no public API surface to catalog — and the
  mobcrush.com domain, while still registered, no longer resolves at all. This profile is
  retained as a historical record.
